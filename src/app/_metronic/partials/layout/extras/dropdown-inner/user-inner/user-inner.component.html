<ng-container *ngIf="user">
  <div class="styever-user-head d-flex align-items-center gap-4 px-5 py-5">
    <div class="symbol symbol-52px"><img *ngIf="!user?.fileId" src="./assets/media/avatars/blank.png" /><img *ngIf="user?.fileId" [src]="avatarUrl" /></div>
    <div class="min-w-0"><div class="fw-bold text-gray-900 fs-5 text-truncate">{{ user.name }} {{ user.surname }}</div><div class="text-gray-500 fs-8 fw-semibold text-truncate">{{ user.email }}</div></div>
  </div>
  <div class="separator my-0"></div>
  <div class="menu-item px-2 pt-2"><a routerLink="/profile/settings" class="menu-link px-4 py-3"><i class="ki-outline ki-user fs-3 me-3"></i><span class="menu-title">{{'MY_PROFILE' | translate}}</span></a></div>
  <div class="menu-item px-2 position-relative styever-language-item">
    <button type="button" class="menu-link border-0 w-100 px-4 py-3 cursor-pointer text-start"
      [class.active]="languageMenuOpen" (click)="toggleLanguageMenu($event)">
      <i class="ki-outline ki-geolocation fs-3 me-3"></i>
      <span class="menu-title flex-grow-1">{{'LANGUAGE' | translate}}</span>
      <span class="styever-current-language">
        <span>{{ ( 'LANG' | translate ) === 'tr' ? language.nameTr : language.nameEn }}</span>
        <img [src]="language.flag" alt="flag" />
      </span>
      <i class="ki-outline fs-4 ms-2" [ngClass]="languageMenuOpen ? 'ki-up' : 'ki-down'"></i>
    </button>

    <div *ngIf="languageMenuOpen" class="styever-language-popover py-2" (click)="$event.stopPropagation()">
      <div *ngFor="let l of langs" class="menu-item px-2 cursor-pointer" (click)="selectLanguage(l.lang)">
        <a class="menu-link d-flex align-items-center px-4 py-3" [ngClass]="{'active': l.lang === language.lang}">
          <span class="symbol symbol-20px me-3"><img class="rounded-1" [src]="l.flag" alt="flag" /></span>
          <span class="menu-title">{{ ( 'LANG' | translate ) === 'tr' ? l.nameTr : l.nameEn }}</span>
        </a>
      </div>
    </div>
  </div>
  <div class="separator my-2"></div>
  <div class="menu-item px-2 pb-2"><a (click)="logout()" class="menu-link px-4 py-3 cursor-pointer text-danger"><i class="ki-outline ki-exit-right fs-3 me-3"></i><span class="menu-title text-danger">{{'AUTH.GENERAL.SIGNOUT_BUTTON' | translate}}</span></a></div>
</ng-container>

<div *ngFor="let l of langs" class="menu-item px-2 cursor-pointer" (click)="selectLanguage(l.lang)"><a class="menu-link d-flex align-items-center px-4 py-3" [ngClass]="{'active': l.lang === language.lang}"><span class="symbol symbol-20px me-3"><img class="rounded-1" [src]="l.flag" alt="flag" /></span><span class="menu-title fw-semibold">{{ ('LANG' | translate) === 'tr' ? l.nameTr : l.nameEn }}</span></a></div>

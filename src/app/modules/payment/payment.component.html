<div [ngStyle]="{'height.px': bannerHeight}">
  <div class="row mx-10" [ngStyle]="{'padding-top.px': bannerPaddingTopHeight}">
    <div class="center-title-wrapper">
      <span class="text-white fw-bolder" style="font-size: 30px;">{{ 'PAYMENT' | translate }}</span>
      <span class="text-white" style="font-size: 15px;">{{ 'PAYMENT_SUBHEADER' | translate }}</span>
    </div>
  </div>
</div>

<div class="row mx-10 my-10">
  <div class="col-lg-9">
    <div class="row">
      <div class="card card-xxl-stretch mb-5 mb-xl-8">
        <div class="row">
          <div class="col-lg-12 px-0 py-0">
            <div (click)="setActiveTabId('payment')"
              [ngClass]="activeTabId == 'payment' ? 'selected-proccess-tab' : 'proccess-tab'">
              <div class="row mb-5 mx-0 my-0 px-5 py-5 fw-bolder fs-3">
                {{ 'PAYMENT_INFOS' | translate }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row" *ngIf="activeTabId == 'payment'">
      <div class="card">
        <div class="card-header border-0 pt-5">
          <h3 class="card-title align-items-start flex-column">
          </h3>

          <div class="card-toolbar">
            <img src="https://img.icons8.com/color/48/000000/visa.png" />
            <img src="https://img.icons8.com/color/48/000000/mastercard-logo.png" />
            <img src="https://img.icons8.com/color/48/000000/maestro.png" />
          </div>
        </div>

        <div class="card-body py-3">
          <form class="form w-100" [formGroup]="paymentForm">
            <div class="fv-row mb-5">
              <label *ngIf="!currentUser && typeId == 3" class="form-label fw-bolder text-gray-900 fs-6">{{
                'SENDER_EMAIL' | translate }}</label>
              <input *ngIf="!currentUser && typeId == 3" class="form-control bg-transparent mb-5" type="text"
                name="senderEmail" formControlName="senderEmail" placeholder="{{ 'SENDER_EMAIL' | translate }}"
                autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['senderEmail'].invalid,
        'is-valid': paymentForm.controls['senderEmail'].valid
      }" />

              <ng-container *ngIf="!currentUser && typeId == 3" [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('SENDER_EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['senderEmail']
      }"></ng-container>

              <label *ngIf="typeId == 3" class="form-label fw-bolder text-gray-900 fs-6">{{ 'RECEIVER_EMAIL' | translate
                }}</label>
              <input *ngIf="typeId == 3" class="form-control bg-transparent mb-5" type="text" name="receiverEmail"
                formControlName="receiverEmail" placeholder="{{ 'RECEIVER_EMAIL' | translate }}" autocomplete="off"
                [ngClass]="{
        'is-invalid': paymentForm.controls['receiverEmail'].invalid,
        'is-valid': paymentForm.controls['receiverEmail'].valid
      }" />
              <ng-container *ngIf="typeId == 3" [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('RECEIVER_EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['receiverEmail']
      }"></ng-container>

              <label *ngIf="typeId == 3" class="form-label fw-bolder text-gray-900 fs-6">{{ 'MESSAGE' | translate
                }}</label>
              <input *ngIf="typeId == 3" class="form-control bg-transparent mb-5" type="text" name="message"
                formControlName="message" placeholder="{{ 'MESSAGE' | translate
                }}" autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['message'].invalid,
        'is-valid': paymentForm.controls['message'].valid
      }" />
              <ng-container *ngIf="typeId == 3" [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('MESSAGE' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['message']
      }"></ng-container>

              <label class="form-label fw-bolder text-gray-900 fs-6">{{'CARD_HOLDER' | translate}}</label>
              <input class="form-control bg-transparent mb-5" type="text" name="fullname" formControlName="fullname"
                placeholder="{{'CARD_HOLDER' | translate}}" autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['fullname'].invalid,
        'is-valid': paymentForm.controls['fullname'].valid
      }" />
              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('CARD_HOLDER' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['fullname']
      }"></ng-container>

              <label class="form-label fw-bolder text-gray-900 fs-6">{{'CARD_NUMBER' | translate}}</label>
              <input class="form-control bg-transparent" type="text" name="cardno" formControlName="cardno"
                placeholder="{{'CARD_NUMBER' | translate}}" autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['cardno'].invalid,
        'is-valid': paymentForm.controls['cardno'].valid
      }" />
              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('CARD_NUMBER' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['cardno']
      }"></ng-container>
            </div>
            <div class="row mb-5">
              <div class="col-lg-6">
                <label class="form-label fw-bolder text-gray-900 fs-6">{{'VALIDITY_DATE' | translate}}</label>
                <input class="form-control bg-transparent" type="text" name="expiryDate" formControlName="expiryDate"
                  placeholder="{{'VALIDITY_DATE_PH' | translate}}" autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['expiryDate'].invalid,
        'is-valid': paymentForm.controls['expiryDate'].valid
      }" />
                <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('VALIDITY_DATE' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['expiryDate']
      }"></ng-container>
              </div>
              <div class="col-lg-6">
                <label class="form-label fw-bolder text-gray-900 fs-6">{{'CVC' | translate }}</label>

                <input class="form-control bg-transparent" type="text" name="cvv" formControlName="cvv"
                  placeholder="{{'CVC' | translate}}" autocomplete="off" [ngClass]="{
        'is-invalid': paymentForm.controls['cvv'].invalid,
        'is-valid': paymentForm.controls['cvv'].valid
      }" />
                <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation: 'required',
        message: ('CVC' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: paymentForm.controls['cvv']
      }"></ng-container>
              </div>
            </div>
          </form>
        </div>
      </div>

      <ng-template #formError let-control="control" let-message="message" let-validation="validation">
        <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
          <div class="fv-plugins-message-container">
            <div class="fv-help-block">
              <span role="alert">
                {{ message }}
              </span>
            </div>
          </div>
        </ng-container>
      </ng-template>
    </div>
  </div>
  <div class="col-lg-3">
    <div class="card card-xxl-stretch mb-5 mb-xl-8">
      <div class="card-header border-0 pt-5">
        <h3 class="card-title align-items-start flex-column">
          <span class="card-label fw-bolder fs-3 mb-1">{{'PAYMENT_SUMMARY' | translate}}</span>
        </h3>
      </div>
      <div class="card-body py-3">
        <table class="table">
          <tr>
            <td style="width: 150px;">
              <div class="d-flex justify-content-start flex-column">
                <a class="text-gray-900 text-hover-primary fs-6">
                  {{'PRICE' | translate}}
                </a>
              </div>
            </td>
            <td>
              <div class="d-flex justify-content-start flex-column">
                <a class="text-gray-900 fw-bolder text-hover-primary fs-6">
                  {{totalPrice}} ₺
                </a>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <div class="separator border-gray-200"></div>
            </td>
          </tr>
          <tr class="table-row-dashed">
            <td style="width: 150px;">
              <div class="d-flex justify-content-start flex-column">
                <a class="text-gray-900 text-hover-primary fs-6">
                  {{'TOTAL' | translate}}
                </a>
              </div>
            </td>
            <td>
              <div class="d-flex justify-content-start flex-column">
                <a class="text-gray-900 fw-bolder text-hover-primary fs-6">
                  {{totalPrice}} ₺
                </a>
              </div>
            </td>
          </tr>
        </table>
        <button [disabled]="paymentForm.invalid" type="button" (click)="confirm()" class="btn btn-primary btn-lg"
          style="width: 100%;">
          <ng-container>
            <span class="indicator-label">{{'PAYMENT' | translate}}</span>
          </ng-container>
        </button>
      </div>
    </div>
  </div>
</div>

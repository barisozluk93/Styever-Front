<form class="form w-100" novalidate="novalidate" [formGroup]="forgotPasswordForm" (ngSubmit)="submit()"
  id="kt_login_password_reset_form">
  <div class="text-center mb-5" routerLink="/home">
    <img alt="Logo" src="./assets/media/logos/icon.png" class="h-150px w-150px" style="border-radius: 20px;" />

    <h1 class="text-primary fw-bolder mt-5">
      {{"FORGOT_PASSWORD" | translate}}
    </h1>

    <div class="text-light-primary fw-semibold fs-6">
      {{"RESETPASSWORDMAIL" | translate}}
    </div>
  </div>

  <ng-container *ngIf="errorState === errorStates.HasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        {{"ERR_FORGOT_PASSWORD" | translate}}
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="errorState === errorStates.NoError">
    <div class="mb-10 bg-light-info p-8 rounded">
      <div class="text-info">{{"RESET_PASSWORD_LINK_SENT" | translate}}</div>
    </div>
  </ng-container>

  <!--begin::Form group-->
  <div class="fv-row mb-8">
    <label class="form-label fw-bolder text-primary fs-6">{{'AUTH.INPUT.EMAIL' | translate}}</label>
    <input class="form-control bg-transparent text-light-primary" type="email" formControlName="email"
      placeholder="{{'AUTH.INPUT.EMAIL' | translate}}" name="email" autocomplete="off" [ngClass]="{
        'is-invalid': forgotPasswordForm.controls['email'].invalid,
        'is-valid': forgotPasswordForm.controls['email'].valid
      }" />

    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'required',
        message: ('AUTH.INPUT.EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: forgotPasswordForm.controls['email']
      }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'email',
        message: ('AUTH.INPUT.EMAIL' | translate) + ' ' + ('AUTH.VALIDATION.INVALID_FIELD' | translate),
        control: forgotPasswordForm.controls['email']
      }"></ng-container>
  </div>
  <!--end::Form group-->
  <!--begin::Form group-->
  <div class="d-flex flex-wrap justify-content-center pb-lg-0">
    <button type="submit" id="kt_password_reset_submit" class="btn btn-primary me-4">
      <span class="indicator-label">{{"AUTH.GENERAL.SUBMIT_BUTTON" | translate}}</span>
      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress">
          {{"PLEASEWAIT" | translate}}
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
    </button>
    <a routerLink="/auth/login" id="kt_login_password_reset_form_cancel_button" class="btn btn-light">
      {{"CANCEL" | translate}}
    </a>
  </div>
  <!--end::Form group-->
</form>
<!--end::Form-->

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
    <div class="fv-plugins-message-container">
      <div class="fv-help-block">
        <span role="alert">{{ message }}</span>
      </div>
    </div>
  </ng-container>
</ng-template>

<form class="form w-100 reset-form" novalidate="novalidate" [formGroup]="resetPasswordForm" (ngSubmit)="submit()" id="kt_login_password_reset_form">
  <div class="mb-6 mb-lg-7">
    <a routerLink="/home" class="auth-mobile-brand d-flex align-items-center justify-content-center mx-auto mb-6 d-lg-none">
      <img alt="Styever" src="./assets/media/logos/icon-transparent.png" class="reset-logo" />
    </a>

    <div class="d-flex align-items-center gap-3 mb-3">
      <span class="reset-eyebrow-line"></span>
      <span class="text-primary fs-8 fw-bold text-uppercase ls-1">Styever</span>
    </div>

    <h1 class="text-gray-900 fw-bolder fs-2x fs-lg-3x mb-2">{{'RESET_PASSWORD' | translate}}</h1>
    <div class="text-gray-500 fw-semibold fs-6 lh-lg">{{'RESET_PASSWORD_SUBHEADER' | translate}}</div>
  </div>

  <ng-container *ngIf="errorState === errorStates.HasError">
    <div class="alert bg-light-danger border border-danger border-dashed d-flex align-items-center p-4 mb-5">
      <i class="ki-outline ki-information-5 fs-2x text-danger me-4"></i>
      <div class="d-flex flex-column">
        <span class="text-danger fw-bold">{{'RESET_PASSWORD_ERROR' | translate}}</span>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="errorState === errorStates.NoError">
    <div class="alert bg-light-success border border-success border-dashed d-flex align-items-center p-4 mb-5">
      <i class="ki-outline ki-check-circle fs-2x text-success me-4"></i>
      <div class="d-flex flex-column">
        <span class="text-success fw-bold">{{'RESET_PASSWORD_SUCCESS' | translate}}</span>
      </div>
    </div>
  </ng-container>

  <div class="fv-row mb-5">
    <label class="form-label fs-6 fw-bold text-gray-800 mb-2">{{'PASSWORD' | translate}}</label>
    <div class="position-relative">
      <i class="ki-outline ki-lock-2 position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i>
      <input
        class="form-control form-control-lg bg-white ps-12"
        type="password"
        placeholder="{{'PASSWORD' | translate}}"
        name="password"
        formControlName="password"
        autocomplete="new-password"
        [ngClass]="{
          'is-invalid': resetPasswordForm.controls['password'].invalid && (resetPasswordForm.controls['password'].dirty || resetPasswordForm.controls['password'].touched),
          'is-valid': resetPasswordForm.controls['password'].valid && (resetPasswordForm.controls['password'].dirty || resetPasswordForm.controls['password'].touched)
        }" />
    </div>

    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
      validation: 'required',
      message: 'PASSWORD_REQUIRED' | translate,
      control: resetPasswordForm.controls['password']
    }"></ng-container>
  </div>

  <div class="fv-row mb-5">
    <label class="form-label fs-6 fw-bold text-gray-800 mb-2">{{'CONFIRM_PASSWORD' | translate}}</label>
    <div class="position-relative">
      <i class="ki-outline ki-lock-3 position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i>
      <input
        class="form-control form-control-lg bg-white ps-12"
        type="password"
        placeholder="{{'CONFIRM_PASSWORD' | translate}}"
        name="cPassword"
        autocomplete="new-password"
        formControlName="cPassword"
        [ngClass]="{
          'is-invalid': resetPasswordForm.controls['cPassword'].invalid && (resetPasswordForm.controls['cPassword'].dirty || resetPasswordForm.controls['cPassword'].touched),
          'is-valid': resetPasswordForm.controls['cPassword'].valid && (resetPasswordForm.controls['cPassword'].dirty || resetPasswordForm.controls['cPassword'].touched)
        }" />
    </div>

    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
      validation: 'required',
      message: ('CONFIRM_PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate),
      control: resetPasswordForm.controls['cPassword']
    }"></ng-container>

    <ng-container *ngIf="resetPasswordForm.controls['cPassword'].errors?.ConfirmPassword && (resetPasswordForm.controls['cPassword'].dirty || resetPasswordForm.controls['cPassword'].touched)">
      <div class="fv-plugins-message-container mt-1">
        <span class="text-danger fs-8 fw-semibold">{{'NOMATCH_PASSWORD' | translate}}</span>
      </div>
    </ng-container>
  </div>

  <div class="d-grid mt-6 mb-4">
    <button
      type="submit"
      id="kt_password_reset_submit"
      class="btn btn-lg btn-primary reset-submit"
      [disabled]="resetPasswordForm.invalid || (isLoading$ | async)">
      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress" [style.display]="'block'">
          {{'PLEASEWAIT' | translate}}
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
      <ng-container *ngIf="(isLoading$ | async) === false">
        <span class="indicator-label d-flex align-items-center justify-content-center gap-2">
          {{'SUBMIT' | translate}}
          <i class="ki-outline ki-arrow-right fs-3"></i>
        </span>
      </ng-container>
    </button>
  </div>

  <a routerLink="/auth/login" id="kt_login_password_reset_form_cancel_button" class="btn btn-lg btn-light-primary w-100 fw-bold">
    <i class="ki-outline ki-arrow-left fs-3 me-2"></i>
    {{'CANCEL' | translate}}
  </a>
</form>

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
    <div class="fv-plugins-message-container mt-1">
      <span role="alert" class="text-danger fs-8 fw-semibold">{{ message }}</span>
    </div>
  </ng-container>
</ng-template>

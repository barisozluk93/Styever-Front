<form class="form w-100" [formGroup]="loginForm" novalidate="novalidate" id="kt_login_signin_form"
  (ngSubmit)="submit()">
  <div class="text-center mb-5" routerLink="/home">
    <img alt="Logo" src="./assets/media/logos/icon.png" class="h-150px w-150px" style="border-radius: 20px;" />

    <h1 class="text-primary fw-bolder mt-5">
      {{'AUTH.LOGIN.BUTTON' | translate}}
    </h1>
  </div>

  <div class="separator mb-5">
  </div>

  <ng-container *ngIf="hasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        {{'ERR_LOGIN' | translate}}
      </div>
    </div>
  </ng-container>

  <div class="fv-row mb-8">
    <label class="form-label fs-6 fw-bolder text-primary">{{'AUTH.INPUT.EMAIL' | translate}}</label>
    <input class="form-control bg-transparent text-light-primary" type="email" name="email" formControlName="email" autocomplete="off"
      [ngClass]="{
        'is-invalid': loginForm.controls['email'].invalid,
        'is-valid': loginForm.controls['email'].valid
      }" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'required',
        message: ('AUTH.INPUT.EMAIL' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: loginForm.controls['email']
      }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'email',
        message: ('AUTH.INPUT.EMAIL' | translate) + ' ' + ('AUTH.VALIDATION.INVALID_FIELD' | translate),
        control: loginForm.controls['email']
      }"></ng-container>
  </div>

  <div class="fv-row mb-3">
    <label class="form-label fw-bolder text-primary fs-6 mb-0">{{'AUTH.INPUT.PASSWORD' | translate}}</label>
    <input class="form-control bg-transparent text-light-primary" type="password" name="password" autocomplete="off"
      formControlName="password" [ngClass]="{
        'is-invalid': loginForm.controls['password'].invalid,
        'is-valid': loginForm.controls['password'].valid
      }" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
        validation: 'required',
        message: ('AUTH.INPUT.PASSWORD' | translate) + ' ' + ('IS_REQUIRED' | translate),
        control: loginForm.controls['password']
      }"></ng-container>
  </div>

  <div class="d-flex flex-stack flex-wrap gap-3 fs-base fw-semibold mb-8">
    <a routerLink="/auth/forgot-password" class="link-primary">
      {{"AUTH.FORGOT.TITLE" | translate}}
    </a>
  </div>

  <div class="d-grid mb-10">
    <button type="submit" id="kt_sign_in_submit" class="btn btn-primary" [disabled]="loginForm.invalid">
      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress" [style.display]="'block'">
          {{"PLEASEWAIT" | translate}}
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
      <ng-container *ngIf="(isLoading$ | async) === false">
        <span class="indicator-label">{{"AUTH.GENERAL.CONTINUE" | translate}}</span>
      </ng-container>
    </button>
  </div>

  <div class="text-gray-500 text-center fw-semibold fs-6">
    {{"AUTH.REGISTER.NOT_REGISTER_YET" | translate}}
    <a routerLink="/auth/registration" class="link-primary">
      {{"AUTH.REGISTER.TITLE" | translate}}
    </a>
  </div>
</form>

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
    <div class="fv-plugins-message-container">
      <span role="alert">
        {{ message }}
      </span>
    </div>
  </ng-container>
</ng-template>

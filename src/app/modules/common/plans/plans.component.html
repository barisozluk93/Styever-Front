<div class="plans-grid row g-6" [ngClass]="{'compact-mode': compactMode}">
  <ng-container *ngFor="let item of planList">
    <div class="plan-column col-12 col-lg-4" (click)="onPlanSelect(item.id)">
      <div class="card plan-card h-100 border-0 cursor-pointer position-relative"
        [ngClass]="{'selected-plan': activePlan == item.id, 'has-popular-ribbon': item.isPopular}">
        <div *ngIf="item.isPopular" class="most-preferred-ribbon">
          <span class="badge most-preferred-badge">
            <i class="bi bi-star-fill most-preferred-star me-1"></i>{{ 'MOST_PREFERRED' | translate }}
          </span>
        </div>
        <div class="card-body d-flex flex-column p-7">
          <div class="d-flex align-items-start justify-content-between gap-4 mb-6">
            <div class="plan-symbol">
              <i class="bi" [ngClass]="item.id === 2 ? 'bi-stars' : item.id === 3 ? 'bi-heart' : 'bi-people'"></i>
            </div>

            <span *ngIf="showSelectionIndicator" class="plan-radio d-flex align-items-center justify-content-center"
              [ngClass]="activePlan == item.id ? 'active' : ''">
              <i *ngIf="activePlan == item.id" class="bi bi-check-lg"></i>
            </span>
          </div>

          <div class="d-flex align-items-end justify-content-between gap-3 mb-5">
            <div>
              <h2 class="fw-bolder text-gray-900 mb-1">{{ item.displayName }}</h2>
            </div>
            <div class="text-end">
              <div class="plan-price text-primary fw-bolder">
                {{ item.currency }}{{ item.price | number:'1.2-2' }}
              </div>
              <div class="text-muted fs-7">/ {{ item.displayPeriod }}</div>
            </div>
          </div>

          <div class="separator separator-dashed mb-5"></div>

          <div class="d-flex flex-column gap-3 flex-grow-1 plan-properties">
            <div class="d-flex align-items-start plan-property" *ngFor="let prop of item.propertiesList">
              <span class="feature-check"><i class="bi bi-check-lg"></i></span>
              <span class="text-gray-700 fw-semibold">{{ prop }}</span>
            </div>
          </div>

          <div *ngIf="isStandByPage && userIsActive" class="mt-auto pt-6">
            <button (click)="$event.stopPropagation(); onPay(item.id)" type="button" class="btn btn-primary w-100 fw-bold">
              {{'PURCHASE_VOUCHER' | translate }}
            </button>
          </div>

          <div *ngIf="isProfilePage" class="mt-auto pt-6">
            <button (click)="$event.stopPropagation(); onBuy(item.id)" type="button" class="btn btn-primary w-100 fw-bold">
              {{'BUY' | translate }}
            </button>
          </div>

          <div *ngIf="!isProfilePage && !isStandByPage" class="trial-badge mt-auto pt-6">
            <span>{{ 'trial' | translate }}</span>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<app-select-memory #selectMemoryModal (isSuccess)="isSuccess($event)"></app-select-memory>

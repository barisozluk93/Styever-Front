<div class="plans-grid row g-3" [ngClass]="{'compact-mode': compactMode}">
  <ng-container *ngFor="let item of planList">
    <div class="plan-column col-12 col-md-4" (click)="onPlanSelect(item.id)">
      <div class="card plan-card h-100 d-flex flex-column position-relative cursor-pointer"
        [ngClass]="{'selected-plan': activePlan == item.id}">
        <div *ngIf="item.id === 3" class="most-preferred-badge">
          {{ 'MOST_PREFERRED' | translate }}
          <i class="bi bi-star-fill"></i>
        </div>

        <div class="card-header plan-card-header border-0 d-flex flex-column align-items-start">
          <div class="d-flex align-items-center justify-content-between w-100 gap-2">
            <h3 class="card-title fw-bolder text-gray-900 mb-0">{{ item.name }}</h3>
            <span *ngIf="showSelectionIndicator" class="plan-radio d-flex align-items-center justify-content-center"
              [ngClass]="activePlan == item.id ? 'active' : ''">
              <i *ngIf="activePlan == item.id" class="bi bi-check-lg"></i>
            </span>
          </div>
          <div class="plan-price fw-bolder text-primary mt-2">{{ item.price }}</div>
        </div>

        <div class="card-body plan-card-body d-flex flex-column flex-grow-1">
          <div class="plan-properties">
            <div class="plan-property d-flex align-items-start" *ngFor="let prop of item.properties">
              <i class="bi bi-check-circle-fill text-primary me-2"></i>
              <span class="text-gray-600 fw-semibold">{{ prop }}</span>
            </div>
          </div>

          <div *ngIf="isStandByPage && userIsActive" class="mt-auto pt-4">
            <button (click)="$event.stopPropagation(); onPay(item.id)" type="button" class="btn btn-primary w-100 fw-bold">
              {{'PURCHASE_VOUCHER' | translate }}
            </button>
          </div>

          <div *ngIf="isProfilePage" class="mt-auto pt-4">
            <button (click)="$event.stopPropagation(); onBuy(item.id)" type="button" class="btn btn-primary w-100 fw-bold">
              {{'BUY' | translate }}
            </button>
          </div>

          <div *ngIf="!isProfilePage && !isStandByPage" class="trial-badge mt-auto">
            <span>{{ 'trial' | translate }}</span>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<app-select-memory #selectMemoryModal (isSuccess)="isSuccess($event)"></app-select-memory>

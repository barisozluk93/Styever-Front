<ng-container *ngIf="page; else inlineContent">
  <div class="container-xxl py-10 py-lg-15">
    <div class="card">
      <div class="card-body p-8 p-lg-12">
        <div *ngIf="loading" class="text-center py-15"><span class="spinner-border text-primary"></span></div>
        <ng-container *ngIf="!loading && item">
          <div *ngIf="showTitle" class="text-center mb-10"><h1 class="fw-bold text-gray-900 fs-2hx">{{ title }}</h1></div>
          <div class="legal-content" [innerHTML]="content"></div>
        </ng-container>
      </div>
    </div>
  </div>
</ng-container>
<ng-template #inlineContent>
  <div *ngIf="loading" class="text-center py-8"><span class="spinner-border text-primary"></span></div>
  <ng-container *ngIf="!loading && item">
    <h4 *ngIf="showTitle" class="fw-bolder text-gray-900 mb-5">{{ title }}</h4>
    <div class="legal-content" [innerHTML]="content"></div>
  </ng-container>
</ng-template>

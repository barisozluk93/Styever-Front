<app-confirmation #confirmationComponent (dismissButtonClick)="delete($event)"></app-confirmation>
<app-address-editsave #editSaveComponent (isSuccess)="isSuccess($event)"></app-address-editsave>

<div class="card border-0 profile-section-card mb-6" *ngIf="user">
  <div class="card-body p-7 p-lg-9">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-7">
      <div>
        <span class="profile-section-kicker">STYEVER</span>
        <h2 class="fs-2 fw-bold text-gray-900 mb-1">{{'MYADDRESSES' | translate}}</h2>
      </div>
      <button *ngIf="isUserActive" type="button" (click)="openSaveModal()" class="btn btn-primary px-6">
        <app-keenicon name="plus" class="fs-4 me-2"></app-keenicon>{{'MENU.NEW' | translate}}
      </button>
    </div>

    <div class="row g-5" *ngIf="addresses.length">
      <div class="col-md-6 col-xl-4" *ngFor="let item of addresses">
        <div class="profile-address-card h-100">
          <div class="d-flex align-items-start justify-content-between gap-3 mb-4">
            <div>
              <div class="fw-bold fs-5 text-gray-900 mb-1">{{item.addressHeader}}</div>
            </div>
            <div class="d-flex gap-2" *ngIf="isUserActive">
              <button (click)="openEditModal(item.id)" type="button" class="btn btn-icon btn-sm btn-light-primary"><app-keenicon name="pencil" class="fs-5"></app-keenicon></button>
              <button (click)="openDeleteModal(item.id)" type="button" class="btn btn-icon btn-sm btn-light-danger"><app-keenicon name="trash" class="fs-5"></app-keenicon></button>
            </div>
          </div>
          <div class="text-gray-600 fs-7 lh-lg">{{item.address}}</div>
          <div class="text-gray-500 fs-8 mt-3">{{item.district}} / {{item.city}} · {{item.country}}</div>
        </div>
      </div>
    </div>

    <div *ngIf="!addresses.length" class="profile-empty text-center py-15">
      <div class="symbol symbol-70px mb-4"><span class="symbol-label bg-light-primary"><app-keenicon name="geolocation" class="fs-1 text-primary"></app-keenicon></span></div>
      <div class="fw-bold fs-5 text-gray-800">{{'NO_DATA_AVAILABLE' | translate}}</div>
    </div>
  </div>
</div>

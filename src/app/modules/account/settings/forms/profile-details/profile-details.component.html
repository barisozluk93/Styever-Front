<div class="profile-form-card card border-0 mb-5 mb-xl-10" *ngIf="user">
  <div class="card-body p-8 p-lg-10">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-8">
      <div>
        <span class="profile-form-kicker">STYEVER</span>
        <h3 class="fs-2 fw-bold text-gray-900 mb-1">{{'PROFILE_DETAILS' | translate}}</h3>
        <div class="text-gray-500 fs-7">{{'PROFILE' | translate}}</div>
      </div>
    </div>

    <form [formGroup]="form" novalidate class="profile-auth-form">
      <div class="field-full avatar-field">
        <label class="form-label fw-bold text-gray-800 mb-3">Avatar</label>
        <div class="d-flex align-items-center flex-wrap gap-5">
          <div class="symbol symbol-80px symbol-fixed position-relative profile-avatar">
            <img *ngIf="user.fileId == undefined" src="./assets/media/avatars/blank.png" alt="Avatar" />
            <img *ngIf="user.fileId != undefined" [src]="avatarUrl" alt="Avatar" />
          </div>
          <div>
            <input type="file" class="d-none" accept="image/*" (change)="onFileChange($event)" #fileUpload />
            <button *ngIf="isUserActive" type="button" class="btn btn-light-primary" (click)="fileUpload.click()">
              <app-keenicon name="picture" class="fs-4 me-2"></app-keenicon>
              {{user.fileId == undefined ? ('UPLOAD' | translate) : ('CHANGE' | translate)}}
            </button>
            <div class="text-gray-500 fs-8 mt-2">300 × 300 px</div>
          </div>
        </div>
      </div>

      <div class="fv-row">
        <label class="form-label required fw-bold text-gray-800">{{'FIRST_NAME' | translate}}</label>
        <div class="position-relative"><i class="ki-outline ki-user position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="text" class="form-control form-control-lg bg-white ps-12" placeholder="{{ 'FIRST_NAME' | translate }}" name="name"
          formControlName="name" [ngClass]="{'is-invalid': form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched),'is-valid': form.controls['name'].valid && (form.controls['name'].dirty || form.controls['name'].touched)}" /></div>
        <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:'Name is required',control:form.controls['name']}"></ng-container>
      </div>

      <div class="fv-row">
        <label class="form-label required fw-bold text-gray-800">{{'LAST_NAME' | translate}}</label>
        <div class="position-relative"><i class="ki-outline ki-user position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="text" class="form-control form-control-lg bg-white ps-12" placeholder="{{ 'LAST_NAME' | translate }}" name="surname"
          formControlName="surname" [ngClass]="{'is-invalid': form.controls['surname'].invalid && (form.controls['surname'].dirty || form.controls['surname'].touched),'is-valid': form.controls['surname'].valid && (form.controls['surname'].dirty || form.controls['surname'].touched)}" /></div>
        <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:'Surname is required',control:form.controls['surname']}"></ng-container>
      </div>

      <div class="fv-row">
        <label class="form-label required fw-bold text-gray-800">{{'USERNAME' | translate}}</label>
        <div class="position-relative"><i class="ki-outline ki-profile-user position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="text" class="form-control form-control-lg bg-white ps-12" placeholder="{{'USERNAME' | translate}}" name="username"
          formControlName="username" [ngClass]="{'is-invalid': form.controls['username'].invalid && (form.controls['username'].dirty || form.controls['username'].touched),'is-valid': form.controls['username'].valid && (form.controls['username'].dirty || form.controls['username'].touched)}" /></div>
        <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:'Username is required',control:form.controls['username']}"></ng-container>
      </div>

      <div class="fv-row">
        <label class="form-label required fw-bold text-gray-800">{{'CONTRACT_PHONE' | translate}}</label>
        <div class="position-relative"><i class="ki-outline ki-phone position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="tel" class="form-control form-control-lg bg-white ps-12" placeholder="{{'CONTRACT_PHONE' | translate}}" name="phone"
          formControlName="phone" [ngClass]="{'is-invalid': form.controls['phone'].invalid && (form.controls['phone'].dirty || form.controls['phone'].touched),'is-valid': form.controls['phone'].valid && (form.controls['phone'].dirty || form.controls['phone'].touched)}" /></div>
        <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:'Phone is required',control:form.controls['phone']}"></ng-container>
      </div>

      <div class="field-full profile-form-actions d-flex justify-content-end">
        <button *ngIf="isUserActive" type="button" class="btn btn-primary px-7" (click)="saveSettings()">
          <app-keenicon name="check" class="fs-4 me-2"></app-keenicon>{{'SAVE_CHANGES' | translate}}
        </button>
      </div>
    </form>

    <ng-template #formError let-control="control" let-message="message" let-validation="validation">
      <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
        <div class="fv-plugins-message-container"><span role="alert">{{ message }}</span></div>
      </ng-container>
    </ng-template>
  </div>
</div>

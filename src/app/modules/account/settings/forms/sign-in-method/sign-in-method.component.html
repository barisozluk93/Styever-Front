<div class="signin-card card bg-white border-0 mb-5 mb-xl-10">
  <div class="card-body p-8 p-lg-10">
    <div class="mb-8">
      <span class="signin-kicker">STYEVER</span>
      <h3 class="fs-2 fw-bold text-gray-900 mb-1">{{'SIGN_IN_METHOD' | translate}}</h3>
      <div class="text-gray-500 fs-7">{{'EMAIL_ADDRESS' | translate}} &amp; {{'PASSWORD' | translate}}</div>
    </div>

    <div class="signin-section">
      <ng-container *ngIf="!showChangeEmailForm">
        <div class="signin-summary rounded d-flex align-items-center justify-content-between flex-wrap gap-4">
          <div>
            <div class="signin-label">{{'EMAIL_ADDRESS' | translate}}</div>
            <div class="signin-value">{{user?.email}}</div>
          </div>
          <button *ngIf="isUserActive" type="button" class="btn btn-light-primary" (click)="toggleEmailForm(true)">{{'CHANGE_EMAIL' | translate}}</button>
        </div>
      </ng-container>

      <ng-container *ngIf="showChangeEmailForm">
        <form class="signin-auth-form" novalidate [formGroup]="changeEmailForm">
          <div class="fv-row field-full">
            <label for="emailaddress" class="form-label required fw-bold text-gray-800">{{'ENTER_NEW_EMAIL_ADDRESS' | translate}}</label>
            <div class="position-relative"><i class="ki-outline ki-sms position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="email" class="form-control form-control-lg bg-white ps-12" id="emailaddress" placeholder="{{'EMAIL_ADDRESS' | translate}}" name="email"
              formControlName="email" [ngClass]="{'is-invalid':changeEmailForm.controls['email'].invalid && (changeEmailForm.controls['email'].dirty || changeEmailForm.controls['email'].touched),'is-valid':changeEmailForm.controls['email'].valid && (changeEmailForm.controls['email'].dirty || changeEmailForm.controls['email'].touched)}" /></div>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:('MENU.NEW'|translate)+' '+('EMAIL'|translate)+' '+('IS_REQUIRED'|translate),control:changeEmailForm.controls['email']}"></ng-container>
          </div>
          <div class="field-full signin-actions d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-primary px-6" (click)="saveEmail()">{{'UPDATE_EMAIL' | translate}}</button>
            <button type="button" class="btn btn-light px-6" (click)="toggleEmailForm(false)">{{'CANCEL' | translate}}</button>
          </div>
        </form>
      </ng-container>
    </div>

    <div class="signin-divider"></div>

    <div class="signin-section">
      <ng-container *ngIf="!showChangePasswordForm">
        <div class="signin-summary rounded d-flex align-items-center justify-content-between flex-wrap gap-4">
          <div>
            <div class="signin-label">{{'PASSWORD' | translate}}</div>
            <div class="signin-value signin-password">••••••••••••</div>
          </div>
          <button *ngIf="isUserActive" type="button" class="btn btn-light-primary" (click)="togglePasswordForm(true)">{{'RESET_PASSWORD' | translate}}</button>
        </div>
      </ng-container>

      <ng-container *ngIf="showChangePasswordForm">
        <form class="signin-auth-form password-grid" novalidate [formGroup]="changePasswordForm">
          <div class="fv-row">
            <label for="currentpassword" class="form-label required fw-bold text-gray-800">{{'CURRENT_PASSWORD' | translate}}</label>
            <div class="position-relative"><i class="ki-outline ki-lock-2 position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="password" class="form-control form-control-lg bg-white ps-12" id="currentpassword" name="currentPassword" formControlName="currentPassword"
              [ngClass]="{'is-invalid':changePasswordForm.controls['currentPassword'].invalid && (changePasswordForm.controls['currentPassword'].dirty || changePasswordForm.controls['currentPassword'].touched),'is-valid':changePasswordForm.controls['currentPassword'].valid && (changePasswordForm.controls['currentPassword'].dirty || changePasswordForm.controls['currentPassword'].touched)}" /></div>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:('CURRENT_PASSWORD'|translate)+' '+('IS_REQUIRED'|translate),control:changePasswordForm.controls['currentPassword']}"></ng-container>
          </div>
          <div class="fv-row">
            <label for="password" class="form-label required fw-bold text-gray-800">{{'NEW_PASSWORD' | translate}}</label>
            <div class="position-relative"><i class="ki-outline ki-lock-2 position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="password" class="form-control form-control-lg bg-white ps-12" id="password" name="password" formControlName="password"
              [ngClass]="{'is-invalid':changePasswordForm.controls['password'].invalid && (changePasswordForm.controls['password'].dirty || changePasswordForm.controls['password'].touched),'is-valid':changePasswordForm.controls['password'].valid && (changePasswordForm.controls['password'].dirty || changePasswordForm.controls['password'].touched)}" /></div>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:('NEW_PASSWORD'|translate)+' '+('IS_REQUIRED'|translate),control:changePasswordForm.controls['password']}"></ng-container>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'minlength',message:('NEW_PASSWORD_RULE_1'|translate),control:changePasswordForm.controls['password']}"></ng-container>
          </div>
          <div class="fv-row">
            <label for="cPassword" class="form-label required fw-bold text-gray-800">{{'CONFIRM_NEW_PASSWORD' | translate}}</label>
            <div class="position-relative"><i class="ki-outline ki-lock-2 position-absolute top-50 translate-middle-y ms-4 fs-2 text-gray-500"></i><input type="password" class="form-control form-control-lg bg-white ps-12" id="cPassword" name="cPassword" formControlName="cPassword"
              [ngClass]="{'is-invalid':changePasswordForm.controls['cPassword'].invalid && (changePasswordForm.controls['cPassword'].dirty || changePasswordForm.controls['cPassword'].touched),'is-valid':changePasswordForm.controls['cPassword'].valid && (changePasswordForm.controls['cPassword'].dirty || changePasswordForm.controls['cPassword'].touched)}" /></div>
            <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{validation:'required',message:('CONFIRM_NEW_PASSWORD'|translate)+' '+('IS_REQUIRED'|translate),control:changePasswordForm.controls['cPassword']}"></ng-container>
            <ng-container *ngIf="changePasswordForm.controls['cPassword'].errors && changePasswordForm.controls['cPassword'].errors.ConfirmPassword">
              <div class="fv-plugins-message-container"><span>{{'PASSWORD_MISMATCH' | translate}}</span></div>
            </ng-container>
          </div>
          <div class="field-full signin-actions d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-primary px-6" (click)="savePassword()">{{'UPDATE_PASSWORD' | translate}}</button>
            <button type="button" class="btn btn-light px-6" (click)="togglePasswordForm(false)">{{'CANCEL' | translate}}</button>
          </div>
        </form>
      </ng-container>
    </div>

    <ng-template #formError let-control="control" let-message="message" let-validation="validation">
      <ng-container *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
        <div class="fv-plugins-message-container"><span role="alert">{{ message }}</span></div>
      </ng-container>
    </ng-template>
  </div>
</div>

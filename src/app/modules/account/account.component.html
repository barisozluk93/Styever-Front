<div class="profile-shell" *ngIf="userData">
  <div class="container-xxl">
    <div class="profile-summary card border-0 mb-5">
      <div class="card-body p-6 p-lg-7">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-5">
          <div class="d-flex align-items-center gap-4">
            <div class="symbol symbol-70px profile-shell-avatar"><img *ngIf="!userData?.fileId" src="./assets/media/avatars/blank.png" alt="Avatar" /><img *ngIf="userData?.fileId" [src]="avatarUrl" alt="Avatar" /></div>
            <div><span class="profile-shell-kicker">STYEVER</span><h1 class="fs-2 fw-bold text-gray-900 mb-1">{{userData?.name}} {{userData?.surname}}</h1><div class="d-flex align-items-center text-gray-500 fs-7"><i class="ki-outline ki-sms fs-5 me-2 text-primary"></i>{{userData?.email}}</div></div>
          </div>
          <nav class="profile-nav" aria-label="Profile navigation">
            <a routerLink="/profile/settings" routerLinkActive="active"><i class="ki-outline ki-user"></i><span>{{'PROFILE' | translate}}</span></a>
            <a routerLink="/profile/addresses" routerLinkActive="active"><i class="ki-outline ki-geolocation"></i><span>{{'MYADDRESSES' | translate}}</span></a>
            <a routerLink="/profile/membership" routerLinkActive="active"><i class="ki-outline ki-crown"></i><span>{{'MEMBERSHIP' | translate}}</span></a>
            <a routerLink="/profile/agreements" routerLinkActive="active"><i class="ki-outline ki-document"></i><span>{{'MY_AGREEMENTS.TITLE' | translate}}</span></a>
          </nav>
        </div>
      </div>
    </div>
    <div class="profile-shell-content"><router-outlet></router-outlet></div>
  </div>
</div>

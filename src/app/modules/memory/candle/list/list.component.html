<app-modal #modal [modalConfig]="modalConfig">
    <div class="row px-0 py-0">
        <div class="col-lg-12">
            <div class="table-responsive">
                <table class="table table-row-dashed table-row-gray-300 align-middle gs-0 gy-4">
                    <tbody>
                        <tr *ngFor="let candle of candles">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="symbol symbol-45px me-5">
                                        <img *ngIf="candle.userAvatar" [src]="candle.fileUrl" alt="" />
                                        <img *ngIf="!candle.userAvatar" src="./assets/media/avatars/blank.png" alt="" />
                                    </div>
                                    <div class="d-flex justify-content-start flex-column">
                                        <a class="fw-bolder text-primary fs-6">
                                            {{candle.userName}}
                                        </a>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end">
                                <div class="d-flex flex-column w-100 me-2">
                                    <div class="d-flex flex-stack mb-2">
                                        <span class="text-light-primary me-2 fs-7 fw-bold"> {{candle.date}}
                                        </span>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</app-modal>

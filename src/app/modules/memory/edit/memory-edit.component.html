<main class="memory-edit-page">
  <section class="memory-edit-hero position-relative">
    <div class="memory-edit-hero__overlay position-absolute top-0 start-0 w-100 h-100"></div>

    <div class="container-xxl position-relative z-index-2">
      <!-- EYEBROW ROW -->
      <div class="memory-edit-eyebrow-row d-flex flex-wrap align-items-center justify-content-between gap-4 mb-7">
        <div class="d-flex align-items-center gap-3 text-white text-uppercase fw-bold fs-8 ls-2">
          <img
            src="/assets/media/logos/logo.png"
            alt="Styever"
            class="memory-edit-hero__brand flex-shrink-0"
          />
          <span>{{ 'MEMORIES' | translate }}</span>
        </div>

        <button
          type="button"
          class="btn btn-light btn-sm px-5 memory-white-btn"
          (click)="goToMemories()"
        >
          <i class="ki-duotone ki-arrow-left fs-4 me-2">
            <span class="path1"></span>
            <span class="path2"></span>
          </i>
          {{ 'SEARCH_PETS' | translate }}
        </button>
      </div>

      <div class="row g-7 g-xl-8 align-items-start">
        <!-- LEFT / CAROUSEL -->
        <div class="col-xl-5 col-lg-5">
          <div class="card card-flush memory-edit-glass-card memory-edit-carousel-card">
            <div class="card-body p-5 p-lg-6">
              <app-carousel
                [isEdit]="form.get('id')?.value > 0"
                [youtubeLinks]="youtubeLinks"
                [files]="mediaFiles"
                [activeMediaIndex]="activeMediaIndex"
                [isImageUploadAllowed]="isImageUploadAllowed"
                [isVideoUploadAllowed]="isVideoUploadAllowed"
                [isYoutubeLinkAllowed]="isYoutubeLinkAllowed"
                (isFileChanged)="onFileChange($event)"
                (isFileDeleted)="isFileDeleted($event)"
                (isOpenYoutubeLinkModalClicked)="openYoutubeLinkModal($event)"
                (isCheckboxClicked)="isCheckboxClicked($event)"
                (isActiveMediaIndexChanged)="onActiveMediaIndexChanged($event)"
              >
              </app-carousel>
            </div>
          </div>
        </div>

        <!-- RIGHT / FORM -->
        <div class="col-xl-7 col-lg-7">
          <div class="card card-flush memory-edit-glass-card memory-edit-form-card">
            <div class="card-body p-6 p-lg-7">
              <div class="memory-edit-form-heading mb-6">
                <div class="text-white text-uppercase fw-bold fs-8 ls-2 mb-3">
                  STYEVER
                </div>

                <h2 class="text-white fw-bolder fs-2x mb-3">
                  Keep their memories alive forever.
                </h2>

                <p class="text-white opacity-75 fs-6 lh-lg mb-0">
                  Share your memories with your closest friend in just a few minutes.
                </p>
              </div>

<form
            class="form w-100 memory-auth-form"
            [formGroup]="form"
            novalidate="novalidate">




            <!-- =================================================
                 PRIVACY
                 ================================================= -->
            <div class="privacy-options field-full">

              <!-- PRIVATE -->
              <label
                class="card privacy-option border border-gray-300 shadow-none">

                <input
                  class="form-check-input"
                  type="checkbox"
                  id="isPrivate"
                  formControlName="isPrivate"
                  (change)="onIsPrivateChange($event)"
                />

                <span>

                  <strong class="text-gray-800">
                    {{ 'IS_PRIVATE' | translate }}
                  </strong>

                  <small class="text-gray-500">
                    {{ 'PUBLIC_PROFILE_WARNING_TEXT' | translate }}
                  </small>

                </span>

              </label>


              <!-- LINK ONLY -->
              <label
                class="card privacy-option border border-gray-300 shadow-none">

                <input
                  class="form-check-input"
                  type="checkbox"
                  id="isLinkOnly"
                  formControlName="isLinkOnly"
                  (change)="onIsLinkOnlyChange($event)"
                />

                <span>

                  <strong class="text-gray-800">
                    {{ 'LINK_ONLY' | translate }}
                  </strong>

                </span>

              </label>


              <!-- COMMENTS -->
              <label
                class="card privacy-option border border-gray-300 shadow-none">

                <input
                  class="form-check-input"
                  type="checkbox"
                  id="isOpenToComment"
                  formControlName="isOpenToComment"
                />

                <span>

                  <strong class="text-gray-800">
                    {{ 'OPEN_TO_COMMENT' | translate }}
                  </strong>

                </span>

              </label>

            </div>


            <!-- =================================================
                 PET TYPE
                 ================================================= -->
            <div class="fv-row">

              <label
                class="form-label fs-6 fw-bold text-gray-800 mb-2">

                {{ 'BF_TYPE' | translate }}

              </label>

              <div class="position-relative">

                <i
                  class="ki-outline ki-category memory-form-icon position-absolute top-50 translate-middle-y fs-2 text-gray-500">
                </i>

                <select
                  name="category"
                  formControlName="categoryId"
                  autocomplete="off"
                  class="form-select form-select-lg bg-white ps-12"
                  [ngClass]="{
                    'is-invalid':
                      form.controls['categoryId'].invalid &&
                      (
                        form.controls['categoryId'].dirty ||
                        form.controls['categoryId'].touched
                      ),
                    'is-valid':
                      form.controls['categoryId'].valid &&
                      (
                        form.controls['categoryId'].dirty ||
                        form.controls['categoryId'].touched
                      )
                  }">

                  <option value="">
                    {{ 'SELECT_PET' | translate }}
                  </option>

                  <ng-container
                    *ngFor="let category of categoryList">

                    <option [value]="category.id">

                      {{
                        ('LANG' | translate) === 'tr'
                          ? category.name
                          : category.nameEn
                      }}

                    </option>

                  </ng-container>

                </select>

              </div>

              <ng-container
                [ngTemplateOutlet]="formError"
                [ngTemplateOutletContext]="{
                  validation: 'required',
                  message:
                    ('BF_TYPE' | translate) +
                    ' ' +
                    ('IS_REQUIRED' | translate),
                  control: form.controls['categoryId']
                }">
              </ng-container>

            </div>


            <!-- =================================================
                 PET NAME
                 ================================================= -->
            <div class="fv-row">

              <label
                class="form-label fs-6 fw-bold text-gray-800 mb-2">

                {{ 'BF_NAME' | translate }}

              </label>

              <div class="position-relative">

                <i
                  class="ki-outline ki-heart memory-form-icon position-absolute top-50 translate-middle-y fs-2 text-gray-500">
                </i>

                <input
                  class="form-control form-control-lg bg-white ps-12"
                  type="text"
                  name="name"
                  formControlName="name"
                  autocomplete="off"
                  [placeholder]="'BF_NAME' | translate"
                  [ngClass]="{
                    'is-invalid':
                      form.controls['name'].invalid &&
                      (
                        form.controls['name'].dirty ||
                        form.controls['name'].touched
                      ),
                    'is-valid':
                      form.controls['name'].valid &&
                      (
                        form.controls['name'].dirty ||
                        form.controls['name'].touched
                      )
                  }"
                />

              </div>

              <ng-container
                [ngTemplateOutlet]="formError"
                [ngTemplateOutletContext]="{
                  validation: 'required',
                  message:
                    ('BF_NAME' | translate) +
                    ' ' +
                    ('IS_REQUIRED' | translate),
                  control: form.controls['name']
                }">
              </ng-container>

            </div>


            <!-- =================================================
                 BIRTH DATE
                 ================================================= -->
            <div class="fv-row">

              <label
                class="form-label fs-6 fw-bold text-gray-800 mb-2">

                {{ 'BIRTH_DATE' | translate }}

              </label>

              <div class="position-relative">

                <i
                  class="ki-outline ki-calendar memory-form-icon position-absolute top-50 translate-middle-y fs-2 text-gray-500">
                </i>

                <input
                  class="form-control form-control-lg bg-white ps-12"
                  type="date"
                  name="birthDate"
                  formControlName="birthDate"
                  autocomplete="off"
                  [ngClass]="{
                    'is-invalid':
                      form.controls['birthDate'].invalid &&
                      (
                        form.controls['birthDate'].dirty ||
                        form.controls['birthDate'].touched
                      ),
                    'is-valid':
                      form.controls['birthDate'].valid &&
                      (
                        form.controls['birthDate'].dirty ||
                        form.controls['birthDate'].touched
                      )
                  }"
                />

              </div>

              <ng-container
                [ngTemplateOutlet]="formError"
                [ngTemplateOutletContext]="{
                  validation: 'required',
                  message:
                    ('BIRTH_DATE' | translate) +
                    ' ' +
                    ('IS_REQUIRED' | translate),
                  control: form.controls['birthDate']
                }">
              </ng-container>

            </div>


            <!-- =================================================
                 DEATH DATE
                 ================================================= -->
            <div class="fv-row">

              <label
                class="form-label fs-6 fw-bold text-gray-800 mb-2">

                {{ 'DEATH_DATE' | translate }}

              </label>

              <div class="position-relative">

                <i
                  class="ki-outline ki-calendar memory-form-icon position-absolute top-50 translate-middle-y fs-2 text-gray-500">
                </i>

                <input
                  class="form-control form-control-lg bg-white ps-12"
                  type="date"
                  name="deathDate"
                  formControlName="deathDate"
                  autocomplete="off"
                  [ngClass]="{
                    'is-invalid':
                      form.controls['deathDate'].invalid &&
                      (
                        form.controls['deathDate'].dirty ||
                        form.controls['deathDate'].touched
                      ),
                    'is-valid':
                      form.controls['deathDate'].valid &&
                      (
                        form.controls['deathDate'].dirty ||
                        form.controls['deathDate'].touched
                      )
                  }"
                />

              </div>

              <ng-container
                [ngTemplateOutlet]="formError"
                [ngTemplateOutletContext]="{
                  validation: 'required',
                  message:
                    ('DEATH_DATE' | translate) +
                    ' ' +
                    ('IS_REQUIRED' | translate),
                  control: form.controls['deathDate']
                }">
              </ng-container>

            </div>


            <!-- =================================================
                 MEMORY TEXT
                 ================================================= -->
            <div class="fv-row field-full">

              <label
                class="form-label fs-6 fw-bold text-gray-800 mb-2">

                {{ 'MEMORY_TEXT' | translate }}

              </label>

              <div class="position-relative textarea-wrap">

                <i
                  class="ki-outline ki-notepad-edit memory-textarea-icon position-absolute fs-2 text-gray-500">
                </i>

                <textarea
                  class="form-control form-control-lg bg-white ps-12"
                  name="text"
                  formControlName="text"
                  autocomplete="off"
                  rows="8"
                  [attr.maxlength]="allowedCharacterCount"
                  [placeholder]="'MEMORY_TEXT' | translate"
                  [ngClass]="{
                    'is-invalid':
                      form.controls['text'].invalid &&
                      (
                        form.controls['text'].dirty ||
                        form.controls['text'].touched
                      ),
                    'is-valid':
                      form.controls['text'].valid &&
                      (
                        form.controls['text'].dirty ||
                        form.controls['text'].touched
                      )
                  }">
                </textarea>

              </div>

              <div class="text-end text-gray-500 fs-8 mt-2">
                {{ form.get('text')?.value?.length || 0 }}
                /
                {{ allowedCharacterCount }}
              </div>

              <ng-container
                [ngTemplateOutlet]="formError"
                [ngTemplateOutletContext]="{
                  validation: 'required',
                  message:
                    ('MEMORY_TEXT' | translate) +
                    ' ' +
                    ('IS_REQUIRED' | translate),
                  control: form.controls['text']
                }">
              </ng-container>

            </div>


            <!-- =================================================
                 SUBMIT
                 ================================================= -->
            <div class="field-full d-flex justify-content-end pt-4">

              <button
                type="button"
                class="btn btn-primary btn-lg px-10 memory-submit-btn"
                (click)="submit()"
                [disabled]="disableSubmitButton()">

                <span>
                  {{ 'SUBMIT' | translate }}
                </span>

                <i class="ki-duotone ki-arrow-right fs-3 ms-2">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>

              </button>

            </div>

          </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

<ng-template
            #formError
            let-control="control"
            let-message="message"
            let-validation="validation">

            <ng-container
              *ngIf="
                control.hasError(validation) &&
                (
                  control.dirty ||
                  control.touched
                )
              ">

              <div class="fv-plugins-message-container mt-1 text-danger fw-semibold fs-7">

                <span
                  role="alert"
                  class="text-danger fs-8 fw-semibold">

                  {{ message }}

                </span>

              </div>

            </ng-container>

          </ng-template>
</main>

<app-memory-youtube
  #youtubeComponent
  (isSuccess)="isSuccess($event)">
</app-memory-youtube>

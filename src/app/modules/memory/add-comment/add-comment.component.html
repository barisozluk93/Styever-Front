<app-modal #modal [modalConfig]="modalConfig">
    <div class="row px-0 py-0">
        <div class="col-lg-12 px-0 py-0">
            <div class="card">
                <div class="card-body">
                    <ng-container *ngFor="let comment of comments">
                        <div class="d-flex align-items-center">
                            <div class="symbol symbol-50px me-5">
                                <img *ngIf="comment.userAvatar" [src]="comment.fileUrl" class="" alt="" />
                                <img *ngIf="!comment.userAvatar" src="./assets/media/avatars/blank.png" />
                            </div>
                            <div class="flex-grow-1">
                                <div *ngIf="comment.own" class="py-5" style="height: 25px;">
                                    <button (click)="deleteComment(comment.id)" style="float: right;" type="button"
                                        class="btn btn-sm btn-icon btn-color-danger btn-active-light-danger"
                                        title="Delete">
                                        <span [inlineSVG]="'./assets/media/icons/duotune/general/gen027.svg'"
                                            class="svg-icon svg-icon-5"></span>
                                    </button>
                                </div>
                                    <a class="text-gray-900 fw-bolder text-hover-primary fs-6">
                                        {{comment.userName}}
                                    </a>
                                    <span class="text-muted d-block fw-bold">
                                        {{comment.comment}}
                                    </span>
                                    <span class="text-muted d-block fw-bold" style="float: right;">
                                        {{comment.date}}
                                    </span>
                            </div>
                        </div>
                        <div class="separator mb-5 mt-5"></div>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
</app-modal>

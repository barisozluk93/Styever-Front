<app-modal #modal [modalConfig]="modalConfig">
    <div class="row px-0 py-0">
        <div class="col-lg-12">

            <div class="table-responsive">
                <table class="table table-row-dashed table-row-gray-300 align-middle gs-0 gy-4">
                    <tbody>
                        <tr *ngFor="let comment of comments">
                            <td width="35%">
                                <div class="d-flex align-items-center">
                                    <div class="symbol symbol-45px me-5">
                                        <img *ngIf="comment.userAvatar" [src]="comment.fileUrl" alt="" />
                                        <img *ngIf="!comment.userAvatar" src="./assets/media/avatars/blank.png"
                                            alt="" />
                                    </div>
                                    <div class="d-flex justify-content-start flex-column">
                                        <a class="text-primary fw-bolder fs-6">
                                            {{comment.userName}}
                                        </a>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <a class="fw-bolder text-light-primary d-block mb-1 fs-6">
                                    {{comment.comment}}
                                </a>
                            </td>
                            <td width="15%">
                                <div class="d-flex flex-column w-100 me-2">
                                    <div class="d-flex flex-stack mb-2">
                                        <span class="text-light-primary me-2 fs-7 fw-bold"> {{comment.date}}
                                        </span>
                                    </div>
                                </div>
                            </td>
                            <td width="5%" *ngIf="comment.own || isMemoryMine" class="text-end">
                                <div class="d-flex flex-column w-100 me-2">
                                    <div class="d-flex flex-stack mb-2">
                                        <button type="button" (click)="deleteComment(comment.id)"
                                            class="btn btn-sm btn-icon btn-color-danger btn-active-light-danger me-4"
                                            title="Delete">
                                            <span [inlineSVG]="'./assets/media/icons/duotune/general/gen027.svg'"
                                                class="svg-icon svg-icon-2"></span>
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</app-modal>

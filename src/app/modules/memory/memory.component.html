<main class="styever-memories">
  <!-- HERO -->
  <section class="memory-hero position-relative d-flex align-items-center">
    <div class="memory-hero__overlay position-absolute top-0 start-0 w-100 h-100"></div>

    <div class="container-xxl position-relative z-index-2 h-100 d-flex align-items-center">
      <div class="row align-items-center w-100 g-8">
        <div class="col-xl-6 col-lg-6">
          <div class="d-flex align-items-center gap-3 mb-6 text-white text-uppercase fw-bold fs-8 ls-2">
            <img
              src="/assets/media/logos/logo.png"
              alt="Styever"
              class="memory-hero__brand flex-shrink-0"
            />
            <span>{{ 'MEMORIES' | translate }}</span>
          </div>

          <h1 class="memory-hero__title text-white fw-bolder mb-5">
            {{ 'MEMORY_HEADER' | translate }}
          </h1>

          <p class="text-white opacity-75 fs-5 lh-lg mw-650px mb-0">
            {{ 'MEMORY_SUBHEADER' | translate }}
          </p>
        </div>

        <div class="col-xl-6 col-lg-6">
          <div class="ps-lg-6">
            <form
              class="input-group bg-white rounded shadow-sm p-2 memory-search"
              (ngSubmit)="onSearch()"
            >
              <span class="input-group-text border-0 bg-transparent ps-3 pe-2">
                <i class="ki-duotone ki-magnifier fs-2 text-primary">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </span>

              <input
                type="search"
                class="form-control form-control-lg border-0 bg-transparent shadow-none"
                [placeholder]="'SEARCH_BAR' | translate"
                [(ngModel)]="searchTerm"
                name="searchTerm"
              />

              <button type="submit" class="btn btn-primary px-6 memory-search__button">
                {{ 'SEARCH_BAR' | translate }}
                <i class="ki-duotone ki-arrow-right fs-3 ms-2">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </button>
            </form>

            <div class="d-flex flex-column flex-md-row align-items-stretch gap-3 mt-4">
              <div class="flex-grow-1">
                <div class="input-group bg-white rounded overflow-hidden h-100">
                  <span class="input-group-text border-0 bg-white ps-4 pe-2">
                    <i class="ki-duotone ki-filter fs-3 text-primary">
                      <span class="path1"></span>
                      <span class="path2"></span>
                    </i>
                  </span>

                  <select
                    class="form-select border-0 bg-white shadow-none"
                    name="petType"
                    (change)="onPetTypeChange($event)"
                  >
                    <option value="">{{ 'SELECT_PET' | translate }}</option>

                    <ng-container *ngFor="let category of categoryList">
                      <option [value]="category.id">
                        {{
                          ('LANG' | translate) === 'tr'
                            ? category.name
                            : category.nameEn
                        }}
                      </option>
                    </ng-container>
                  </select>
                </div>
              </div>

              <label
                *ngIf="isMyListVisible"
                class="d-flex align-items-center gap-3 bg-white rounded px-4 py-3 cursor-pointer mb-0 memory-mine"
              >
                <input
                  class="form-check-input m-0"
                  type="checkbox"
                  id="mine"
                  (change)="onCheckboxChange($event)"
                />
                <span class="fw-semibold text-gray-700 text-nowrap">
                  {{ 'MY_MEMORIES' | translate }}
                </span>
              </label>

              <button
                *ngIf="isNewMemoryVisible"
                type="button"
                class="btn btn-primary px-6"
                (click)="goToNewMemory()"
              >
                {{ 'ADD_MEMORY' | translate }}
                <i class="ki-duotone ki-plus fs-3 ms-2">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MEMORY LIST -->
  <section id="memory-list" class="py-10 py-lg-12 memory-app-bg">
    <div class="container-xxl">
      <div
        *ngIf="dataSource?.length"
        class="row g-6 g-lg-8"
      >
        <div
          *ngFor="let data of dataSource"
          class="col-lg-6"
        >
          <article class="card card-flush h-100 overflow-hidden shadow-sm memory-card">
            <div
              class="memory-card__media position-relative"
              [style.backgroundImage]="
                'url(' +
                (data.fileUrl || './assets/media/patterns/blank.jpg') +
                ')'
              "
            >
              <div class="memory-card__shade position-absolute top-0 start-0 w-100 h-100"></div>

              <div
                *ngIf="data.qrData"
                class="position-absolute top-0 end-0 m-5 p-2 bg-white rounded shadow-sm memory-card__qr"
              >
                <qrcode
                  [qrdata]="data.qrData"
                  [width]="72"
                  [errorCorrectionLevel]="'M'"
                ></qrcode>
              </div>

              <div class="position-absolute start-0 end-0 bottom-0 p-6 p-lg-7 z-index-2">
                <div class="d-flex align-items-center gap-3 mb-5">
                  <span class="symbol symbol-45px flex-shrink-0">
                    <img
                      *ngIf="data.userAvatar"
                      [src]="data.userAvatarFileUrl"
                      alt=""
                    />

                    <img
                      *ngIf="!data.userAvatar"
                      src="./assets/media/avatars/blank.png"
                      alt=""
                    />
                  </span>

                  <div class="min-w-0">
                    <div class="text-white fw-bold fs-6 text-truncate">
                      {{ data.userName }}
                    </div>
                    <div class="text-white opacity-75 fs-8">
                      {{ data.postDate }}
                    </div>
                  </div>
                </div>

                <div class="separator separator-dashed border-white border-opacity-25 mb-4"></div>

                <div class="d-flex align-items-center justify-content-between gap-4">
                  <button
                    type="button"
                    class="btn btn-link p-0 text-white fw-bold fs-4 text-start text-truncate memory-card__title"
                    (click)="memoryEditView(data.id)"
                  >
                    {{ data.name }}
                  </button>

                  <div class="d-flex align-items-center gap-2 flex-shrink-0">
                    <button
                      type="button"
                      class="btn btn-icon btn-sm bg-white bg-opacity-10 memory-action-btn"
                      (click)="reportMemory(data.id)"
                      [title]="'REPORT_CONTENT' | translate"
                    >
                      <i class="bi bi-flag text-white fs-5"></i>
                    </button>

                    <button
                      type="button"
                      class="btn btn-sm bg-white bg-opacity-10 text-white memory-action-btn d-flex align-items-center gap-2 px-3"
                      (click)="openCommentsModal(data.id, data.commentsCount)"
                    >
                      <i class="bi bi-chat text-white fs-5"></i>
                      <span>{{ data.commentsCount }}</span>
                    </button>

                    <button
                      type="button"
                      class="btn btn-sm bg-white bg-opacity-10 text-white memory-action-btn d-flex align-items-center gap-2 px-3"
                      (click)="openLikesModal(data.id, data.likesCount)"
                    >
                      <i
                        class="bi text-white fs-5"
                        [ngClass]="data.ownLike ? 'bi-heart-fill' : 'bi-heart'"
                      ></i>
                      <span>{{ data.likesCount }}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      </div>

      <!-- EMPTY -->
      <div
        *ngIf="totalCount === 0"
        class="card card-flush border border-gray-300 shadow-none text-center memory-empty"
      >
        <div class="card-body py-15 py-lg-20">
          <span class="symbol symbol-70px mb-6">
            <span class="symbol-label bg-light-primary">
              <i class="ki-duotone ki-heart fs-1 text-primary">
                <span class="path1"></span>
                <span class="path2"></span>
              </i>
            </span>
          </span>

          <h3 class="fw-bold text-gray-900 mb-0">
            {{ 'NO_DATA_AVAILABLE' | translate }}
          </h3>
        </div>
      </div>

      <!-- LOAD MORE -->
      <div
        *ngIf="isLoadingMore"
        class="d-flex justify-content-center py-8"
        aria-live="polite"
      >
        <span class="spinner-border spinner-border-sm text-primary"></span>
      </div>
    </div>
  </section>
</main>

<app-memory-comment
  #commentsComponent
  (isSuccess)="isSuccess($event)"
></app-memory-comment>

<app-memory-like
  #likesComponent
></app-memory-like>

<div [ngStyle]="{'height.px': bannerHeight}">
  <div class="row mx-10" [ngStyle]="{'padding-top.px': bannerPaddingTopHeight}">
    <div class="center-title-wrapper">
      <span class="text-white fw-bolder" style="font-size: 30px;">Anılarını sonsuza kadar yaşat</span>

      <span class="text-white" style="font-size: 15px;">Birkaç dakika içinde en yakın dostunla
        anılarını paylaş.</span>
    </div>
  </div>

  <div class="row mx-10" [ngStyle]="{'padding-top.px': bannerToolPaddingTopHeight}">
    <div [ngClass]="isNewMemoryVisible ? 'col-lg-2' : 'col-lg-4'">
      <select class="form-select form-select-solid form-select-lg fw-bold" name="petType"
        (change)="onPetTypeChange($event)">
        <option value="">Seçiniz...</option>
        <ng-container *ngFor="let category of categoryList">
          <option value={{category.id}}>{{category.name}}</option>
        </ng-container>
      </select>
    </div>
    <div class="col-lg-8">
      <form class="form-inline" (ngSubmit)="onSearch()">
        <div class="input-group mb-3">
          <input class="form-control" type="search" placeholder="{{'SEARCH_BAR' | translate}}" aria-label="Ara"
            [(ngModel)]="searchTerm" name="searchTerm">
          <div class="input-group-append">

            <button type="submit" class="btn btn-light-primary"
              style="border-top-left-radius: 0px; border-bottom-left-radius: 0px;">
              <ng-container>
                <span class="indicator-label">
                  {{'SEARCH_BAR' | translate}}
                </span>
              </ng-container>
            </button>
          </div>
        </div>
      </form>
    </div>
    <div *ngIf="isNewMemoryVisible" [ngClass]="isNewMemoryVisible ? 'col-lg-2' : ''">
      <a class="btn btn-custom btn-active-white btn-color-white btn-primary w-100" data-bs-toggle="modal"
        data-bs-target="#kt_modal_create_app" id="kt_toolbar_primary_button" (click)="goToNewMemory()">
        Yeni anı paylaş
      </a>
    </div>
  </div>
</div>

<div class="row mx-10 my-10">
  <ng-container *ngFor="let data of dataSource">
    <div class="col-lg-6 mb-5">
      <div class="card border-0" style="border-radius: 8px; cursor: pointer;">
        <div class="card-body px-0 py-0">
          <div class="d-flex flex-wrap flex-sm-nowrap">
            <div class="me-7">
              <img *ngIf="data.fileUrl" class="image" [src]="data.fileUrl" />
              <img *ngIf="!data.fileUrl" class="image" src="./../../../assets/media/patterns/blank.jpg" />
            </div>
            <div class="flex-grow-1">
              <div class="px-5 py-5" style="height: 50px;">
                <span (click)="memoryEditView(data.id)" class="text-hover-primary fs-2 fw-bolder me-2" style="float: left;">{{data.name}}</span>
                <span (click)="openLikesModal(data.id, data.likesCount)" class="text-hover-primary fw-bolder me-2"
                  style="float: right;"><i class="bi fs-6 bi-heart-fill me-2"
                    [ngClass]="data.ownLike! ? 'text-primary' : ''"></i>{{data.likesCount}}</span>
                <span (click)="openCommentsModal(data.id, data.commentsCount)" class="text-hover-primary fw-bolder me-2"
                  style="float: right;"><i class="bi fs-6 bi-chat me-2"></i>{{data.commentsCount}}</span>
              </div>
              <div class="separator"></div>
              <div class="px-5 py-5" style="height: 100px;">
                <div>
                  <label class="form-label fw-bolder text-gray-600">Türü</label>
                  <span class="fw-bolder me-2" style="float: right;">{{data.category?.name}}</span>
                </div>
                <div>
                  <label class="form-label fw-bolder text-gray-600">Doğum Tarihi</label>
                  <span class="fw-bolder me-2" style="float: right;"><i
                      class="bi fs-6 bi-calendar me-2"></i>{{data.birthDate}}</span>
                </div>
                <div>
                  <label class="form-label fw-bolder text-gray-600">Ölüm Tarihi</label>
                  <span class="fw-bolder me-2" style="float: right;"><i
                      class="bi fs-6 bi-calendar me-2"></i>{{data.deathDate}}</span>
                </div>
              </div>
              <div class="separator"></div>
              <div class="px-5 py-5" style="height: 50px;">
                <span class="text-hover-primary fw-bolder me-2" style="float: left;"><i
                    class="bi fs-6 bi-person me-2"></i>{{data.userName!}}</span>

                <span class="text-hover-primary fw-bolder me-2" style="float: right;"><i
                    class="bi fs-6 bi-calendar me-2"></i>{{data.postDate}}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<ng-container *ngIf="totalCount == 0">
  <div class="row mx-10 pt-5">
    <div class="col-xxl-12" style="height: 500px; text-align: center; align-items: center;">
      <div class="card card-xl-stretch mb-xl-8">
        <div class="card-body">
          <div class="d-flex justify-content-start flex-column" style="position: absolute;
                left: 50%;
                top: 50%;
                -webkit-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);">
            <a class="text-gray-900 fw-bolder text-hover-primary fs-6">
              {{'NO_DATA_AVAILABLE' | translate}}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
<div class="row">
  <ngb-pagination *ngIf="totalCount > 0" [collectionSize]="totalCount" [(page)]="paginationModel.pageNumber"
    [pageSize]="paginationModel.pageSize" [rotate]="true" [ellipses]="false" [boundaryLinks]="true"
    (pageChange)="onPageChanges()">
  </ngb-pagination>
</div>

<app-memory-comment #commentsComponent></app-memory-comment>
<app-memory-like #likesComponent></app-memory-like>

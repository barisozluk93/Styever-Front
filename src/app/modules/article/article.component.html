<div [ngStyle]="{'height.px': bannerHeight}">
  <div class="row mx-10" [ngStyle]="{'padding-top.px': bannerPaddingTopHeight}">
    <div class="center-title-wrapper">
      <span class="text-white fw-bolder" style="font-size: 30px;">{{'SUPPORT_HEADER' | translate}}</span>

      <span class="text-white" style="font-size: 15px;">{{'SUPPORT_SUBHEADER' | translate}}</span>
    </div>
  </div>

  <div class="row mx-10" [ngStyle]="{'padding-top.px': bannerToolPaddingTopHeight}">
    <div class="col-lg-2">
    </div>
    <div class="col-lg-8">
      <form class="form-inline" (ngSubmit)="onSearch()">
        <div class="input-group mb-3">
          <input class="form-control" type="search" placeholder="{{'SEARCH_BAR' | translate}}" aria-label="Ara"
            [(ngModel)]="searchTerm" name="searchTerm">
          <div class="input-group-append">

            <button type="submit" class="btn btn-custom btn-active-white btn-color-white btn-primary"
              style="border-top-left-radius: 0px; border-bottom-left-radius: 0px;">
              <ng-container>
                <span class="indicator-label">
                  {{'SEARCH_BAR' | translate}}
                </span>
              </ng-container>
            </button>
          </div>
        </div>
      </form>
    </div>
    <div class="col-lg-2">
    </div>
  </div>
</div>

<div class="row mx-10 my-10">
  <ng-container *ngFor="let data of dataSource">
    <div class="col-lg-4 mb-5">
      <div class="card border-0" style="border-radius: 8px; cursor: pointer;">
        <div class="card-body px-0 py-0">
          <div class="row mb-5">
            <div class="col-lg-12">
              <img *ngIf="data.file" class="image" [src]="data.fileUrl" />
              <img *ngIf="!data.file" class="image" src="./../../../assets/media/patterns/blank.jpg" />
            </div>
          </div>
          <div class="row">
            <div class="col-lg-12 px-10 mb-5 pb-5">
              <span (click)="articleEditView(data.id)" class="text-hover-primary fs-3 fw-bolder"
                style="float: left;">{{("LANG" | translate) === 'tr' ? data.header : data.headerEn }}</span>
            </div>
            <div class="col-lg-12 mb-5">
              <div class="separator"></div>
            </div>
            <div class="col-lg-12 px-10 mb-5">
              <span class="text-muted fs-5 fw-bolder" style="float: left;">{{("LANG" | translate) === 'tr' ?
                data.subHeader : data.subHeaderEn }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>

<ng-container *ngIf="!dataSource || dataSource.length == 0">
  <div class="row mx-10 pt-5">
    <div class="col-xxl-12" style="height: 500px; text-align: center; align-items: center;">
      <div class="card card-xl-stretch mb-xl-8">
        <div class="card-body">
          <div class="d-flex justify-content-start flex-column" style="position: absolute;
                left: 50%;
                top: 50%;
                -webkit-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);">
            <a class="text-gray-900 fw-bolder text-hover-primary fs-6">
              {{'NO_DATA_AVAILABLE' | translate}}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<div class="container-xxl py-10 py-lg-15">
  <div class="card">
    <div class="card-body p-8 p-lg-12">

      <div class="alert alert-light-primary d-flex align-items-start p-5 mb-10">
        <i class="ki-duotone ki-information-5 fs-2hx text-primary me-4">
          <span class="path1"></span>
          <span class="path2"></span>
          <span class="path3"></span>
        </i>

        <div>
          <h4 class="fw-bold text-gray-900 mb-1">
            {{ 'COOKIE_POLICY.INFO_TITLE' | translate }}
          </h4>

          <span class="text-gray-700 fs-6">
            {{ 'COOKIE_POLICY.INFO_TEXT' | translate }}
          </span>
        </div>
      </div>

      <div class="legal-content">

        <section class="mb-8" *ngFor="let item of introItems">
          <p>{{ item | translate }}</p>
        </section>

        <div class="separator separator-dashed my-10"></div>

        <section>
          <h2>{{ 'COOKIE_POLICY.PURPOSES.TITLE' | translate }}</h2>

          <div class="row g-4 mt-2">
            <div class="col-12 col-md-4" *ngFor="let item of purposeItems">
              <div class="d-flex align-items-center bg-light rounded p-4 h-100">
                <i class="ki-duotone ki-check-circle fs-2 text-primary me-3">
                  <span class="path1"></span>
                  <span class="path2"></span>
                </i>

                <span class="text-gray-700 fw-semibold">
                  {{ item | translate }}
                </span>
              </div>
            </div>
          </div>
        </section>

      </div>

    </div>
  </div>

</div>
